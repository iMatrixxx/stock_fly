[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-review-harness"
version = "2.1.0"
description = "A 股四步深度复盘引擎（资金-锚点-周期-策略），基于现象-数据-推导三步法"
requires-python = ">=3.10"
# 核心运行库仅标准库（见 README §1）；以下为可选能力分组，按需安装：
#   pip install -e ".[test]"   跑测试
#   pip install -e ".[intel]"  跑 hithink 取数/资讯（akshare 等）
#   pip install -e ".[dev]"    全套
[project.optional-dependencies]
test = ["pytest>=7"]
intel = ["akshare>=1.16", "requests>=2.31", "beautifulsoup4>=4.12"]
dev = ["pytest>=7", "akshare>=1.16", "requests>=2.31", "beautifulsoup4>=4.12"]

[tool.setuptools]
packages = [
    "stock_review_harness",
    "stock_review_harness.data",
    "stock_review_harness.logic",
    "stock_review_harness.report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "data_cache", "outputs", "hithink_out", "vendor", "tools/legacy"]

[tool.ruff.lint]
# 只开低误报、高价值的规则集；E501（行长）与 N（命名）留给人工
select = ["F", "E9", "W6", "I", "UP"]
ignore = ["E402"]  # 脚本层 sys.path 注入后再 import 是既有约定
