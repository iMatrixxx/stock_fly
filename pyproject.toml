[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-review-harness"
version = "2.1.0"
description = "A 股四步深度复盘引擎（资金-锚点-周期-策略），基于现象-数据-推导三步法"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["stock_review_harness", "stock_review_harness.data", "stock_review_harness.report"]
